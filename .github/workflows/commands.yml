name: prsentinel commands

# Slash commands and review-thread replies.
#
# SECURITY NOTE
# Both `issue_comment` and `pull_request_review_comment` can be triggered by
# anyone who can comment, and they run with repository secrets and a
# write-scoped token. Two consequences:
#
#   1. We check out the DEFAULT branch only — never a PR head ref.
#   2. prsentinel itself refuses commands from anyone whose
#      `author_association` is not in `commands.allowed_associations`
#      (default: OWNER, MEMBER, COLLABORATOR). See docs/SECURITY.md.
#
# `.github/workflows/ci.yml` runs a guard that fails the build if this ever
# changes.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: prsentinel-cmd-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  command:
    # Only PRs, and never our own comments.
    if: >
      github.event.comment.user.type != 'Bot' &&
      (github.event.issue.pull_request != null || github.event.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch (never a PR head ref)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run prsentinel
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-model: ${{ vars.PRSENTINEL_MODEL || 'openai/gpt-4o-mini' }}
