name: Publish image

# The action itself still builds from the Dockerfile, and that is deliberate:
# `uses: ./` in self-test.yml compiles the exact revision it checked out, so
# dogfooding always reviews with current source. Publishing a prebuilt image is
# additive — it lets anyone `docker run` or pull the action without a two-minute
# local build, and it is what local-model-smoke.yml exercises.
#
# Tags are explicit rather than `latest`-based: the default branch is `dev`, so
# an automatic `latest` would track unreleased code. `main` is the release tag.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      # The image bundles a pinned llama.cpp build and a Node runtime, so the
      # layer cache is worth keeping: the llama.cpp download and its library
      # layout are the slow, failure-prone part.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
