name: CI

on:
  # `main` is the release branch and `dev` is where work lands; both need CI on
  # push, and every pull request needs it regardless of its base branch.
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verify the bundle runs
        # The bundle routes on the GitHub event, so this step's behaviour
        # depends on which event CI happens to run under. Under pull_request it
        # would attempt a real review and die on credentials that CI
        # deliberately does not have. Running it against an event with no pull
        # request proves what this step is actually for: that the bundle loads
        # and exits cleanly.
        run: |
          echo '{}' > "$RUNNER_TEMP/empty-event.json"
          GITHUB_EVENT_PATH="$RUNNER_TEMP/empty-event.json" GITHUB_EVENT_NAME=push node dist/index.js
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

  guard:
    name: pull_request_target safety guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if a pull_request_target workflow checks out the PR head
        run: node scripts/check-pr-target-safety.mjs

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the action image
        run: docker build -t prsentinel-action .

      # Every other job runs the bundle with `node` directly, so the Dockerfile
      # is otherwise never exercised. The bundled llama.cpp binary is the one
      # piece that cannot be validated any other way: it is a prebuilt glibc
      # binary, and if the base image's glibc or libstdc++ is too old it fails
      # at load time with `GLIBC_x.y not found` — only once a user picks a
      # `local/…` model.
      - name: Verify the bundled inference server loads
        run: |
          docker run --rm --entrypoint /bin/sh prsentinel-action -c '
            set -e
            node --version

            # ldd exits 0 even when a dependency is missing, so read its output
            # rather than trusting its status.
            libs=$(ldd /opt/llama/llama-server)
            case "$libs" in
              *"not found"*) echo "unresolved shared libraries:"; echo "$libs"; exit 1;;
            esac

            # ldd cannot see the CPU backend: ggml dlopens
            # libggml-cpu-<microarch>.so at runtime and picks the variant matching
            # this CPU. Asking for the device list forces that load, and needs no
            # model weights. Tolerating a non-zero exit because --list-devices is
            # a "print and stop" flag whose exit status is not contractual.
            devices=$(llama-server --list-devices 2>&1 || true)
            echo "$devices"
            case "$devices" in
              *"error while loading shared libraries"*) exit 1;;
            esac
            echo "$devices" | grep -q "Available devices"
            echo "$devices" | grep -qi "cpu"
          '
