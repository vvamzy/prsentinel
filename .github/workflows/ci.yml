name: CI

on:
  # `main` is the release branch and `dev` is where work lands; both need CI on
  # push, and every pull request needs it regardless of its base branch.
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verify the bundle runs
        # The bundle routes on the GitHub event, so this step's behaviour
        # depends on which event CI happens to run under. Under pull_request it
        # would attempt a real review and die on credentials that CI
        # deliberately does not have. Running it against an event with no pull
        # request proves what this step is actually for: that the bundle loads
        # and exits cleanly.
        run: |
          echo '{}' > "$RUNNER_TEMP/empty-event.json"
          GITHUB_EVENT_PATH="$RUNNER_TEMP/empty-event.json" GITHUB_EVENT_NAME=push node dist/index.js
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

  guard:
    name: pull_request_target safety guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if a pull_request_target workflow checks out the PR head
        run: node scripts/check-pr-target-safety.mjs

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the action image
        run: docker build -t prsentinel-action .

      # Every other job runs the bundle with `node` directly, so the Dockerfile
      # is otherwise never exercised. The bundled llama.cpp binary is the one
      # piece that cannot be validated any other way, and a mistake in the image
      # only surfaces for a user who picked a `local/…` model — long after CI
      # went green. The script is the same one developers can run locally.
      - name: Verify the bundled inference server works
        run: |
          docker run --rm -i --entrypoint /bin/sh prsentinel-action \
            < scripts/verify-local-model.sh
