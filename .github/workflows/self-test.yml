name: prsentinel self-review

# Dogfooding: prsentinel reviews its own pull requests.
#
# SECURITY NOTE
# We use pull_request_target so the workflow gets a write-scoped token and can
# post the review. That event runs in the context of the BASE branch, and we
# deliberately check out the base ref — never the PR head. prsentinel reads the
# diff as data through the API; it never executes code from the PR.
# `.github/workflows/ci.yml` runs a guard that fails the build if this ever
# changes.

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: prsentinel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft PRs handled by config; run only for same-repo and fork PRs.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch (never the PR head)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # Dogfooding is optional. A fork, or this repository before a key is
      # configured, has no secret — and prsentinel deliberately fails loudly
      # rather than reviewing with no model. Step aside instead of going red,
      # so a missing secret does not look like a broken change.
      # The secret is scoped to this one step rather than the whole job.
      - name: Check for an LLM key
        id: gate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Self-review skipped::Set the LLM_API_KEY secret to have prsentinel review this repository's own pull requests."
          fi

      - name: Run prsentinel
        if: steps.gate.outputs.enabled == 'true'
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-model: ${{ vars.PRSENTINEL_MODEL || 'openai/gpt-4o-mini' }}
